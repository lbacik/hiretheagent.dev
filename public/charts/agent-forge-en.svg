<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
<title id="title">Agent Forge — prepare, build and operate a project-specific coding agent</title>
<desc id="desc">A developer uses create-agent with a coding assistant. Agent Forge analyzes the target repository and generates Dockerfile, Compose, repository profile and environment files. Docker Compose builds an image using simple-coding-agent, Agent SDK, Claude Code runtime and the project toolchain. Compose up creates a container. Its persistent data volume holds the target repository, state and logs. Compose stop stops the container, and exec provides access to agentctl.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
  .title { font-size: 34px; font-weight: 700; fill: #0f172a; }
  .heading { font-size: 23px; font-weight: 700; fill: #0f172a; }
  .body { font-size: 18px; fill: #334155; }
  .meta { font-size: 17px; fill: #64748b; }
  .label { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; }
  .command { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 18px; fill: #2563eb; font-weight: 600; }
</style>

<!-- Canvas Background -->
