<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="850" viewBox="0 0 1680 850" role="img" aria-labelledby="title desc">
<title id="title">Tools &amp; Agent Ecosystem — Operator Tools, agentfleet Contract, and Coding Agent Engines</title>
<desc id="desc">Architecture diagram showing how Agent Forge and Agent Dashboard consume the agentfleet client and versioned operator contract defined in agent-operator-contract, which is implemented by two interchangeable coding agents: simple-coding-agent (Sid) and coding-agent (Rex).</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.2" fill="#dbe2eb"/>
  </pattern>
  <linearGradient id="contractBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#eff6ff"/>
    <stop offset="100%" stop-color="#eef2ff"/>
  </linearGradient>
  <linearGradient id="contractAccent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2563eb"/>
    <stop offset="50%" stop-color="#4f46e5"/>
    <stop offset="100%" stop-color="#059669"/>
  </linearGradient>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
  </marker>
  <marker id="arrowEmerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 Z" fill="#059669"/>
  </marker>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/>
  </marker>
</defs>
