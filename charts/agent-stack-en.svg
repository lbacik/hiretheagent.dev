<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
<title id="title">Agent execution stack — simple-coding-agent v0.3.2</title>
<desc id="desc">Dependency direction: the Python agent uses the Python Claude Agent SDK, which runs the JavaScript Claude Code runtime and its execution loop.</desc>
